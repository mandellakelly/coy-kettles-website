
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F3F1EB">

  <title>COY KETTLES — form meets function</title>
  <meta name="description" content="Coy Kettles. Form meets function.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #F3F1EB;
      color: #292923;
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      padding: 28px;
    }

    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 0 32px;
    }

    .visual {
      position: relative;
      width: min(100%, 900px);
      overflow: hidden;
      background: #E5E1D8;
    }

    .visual img {
      display: block;
      width: 100%;
      height: min(65vh, 650px);
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.06);
    }

    .brand {
      color: #FFFFFF;
      font-size: clamp(25px, 5vw, 48px);
      font-weight: 500;
      letter-spacing: 0.12em;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.18);
    }

    .footer {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: center;
      width: 100%;
      padding-top: 8px;
    }

    .est,
    .loading {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.16em;
      color: #77766F;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .est {
      justify-self: start;
    }

    .loading {
      justify-self: center;
      text-align: center;
    }

    @media (max-width: 600px) {
      .page {
        padding: 20px;
      }

      .main {
        padding: 12px 0 28px;
      }

      .visual img {
        height: 58vh;
      }

      .brand {
        font-size: clamp(22px, 6vw, 34px);
        letter-spacing: 0.08em;
      }

      .est,
      .loading {
        font-size: 8px;
        letter-spacing: 0.1em;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <main class="main">
      <div class="visual">
        <img
          src="coy-kettles.gif"
          alt="Coy Kettles product preview"
        >

        <div class="overlay">
          <div class="brand">COY KETTLES</div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="est">EST. 2026</div>
      <div class="loading">PRODUCT LOADING...</div>
      <div></div>
    </footer>

  </div>
</body>
</html>
